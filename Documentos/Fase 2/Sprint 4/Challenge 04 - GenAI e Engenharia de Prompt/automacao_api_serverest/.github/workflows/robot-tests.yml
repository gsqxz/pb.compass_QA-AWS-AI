name: Execução de Testes Robot - ServeRest

# 1. QUANDO essa automação deve rodar?
on:
  push:
    branches: [ "main", "master", "challenge04-genai" ] # Roda sempre que houver um push na branch principal
  workflow_dispatch:               # Cria um botão no GitHub para você rodar manualmente quando quiser

# 2. O QUE deve ser feito?
jobs:
  testes-api:
    runs-on: ubuntu-latest # Pede ao GitHub um computador com Linux (é mais rápido e barato)

    steps:
      # Passo 2.1: Baixa o seu código para o servidor do GitHub
      - name: 📥 Baixar o código do repositório
        uses: actions/checkout@v4

      # Passo 2.2: Instala o Python no servidor
      - name: 🐍 Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Passo 2.3: Lê o requirements.txt e instala o Robot e bibliotecas
      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Passo 2.4: Roda os testes criando a pasta "results"
      - name: 🤖 Executar os Testes no Robot Framework
        run: robot -d results tests/

      # Passo 2.5: O SEGREDO DO RELATÓRIO!
      - name: 📁 Salvar Relatórios (Logs)
        if: always() # Garante que este passo rode MESMO QUE os testes falhem no passo anterior
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-robot
          path: results/          # Diz ao GitHub para pegar a pasta results inteira
          retention-days: 7       # Guarda o arquivo para download por 7 dias