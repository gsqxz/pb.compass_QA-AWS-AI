name: Execucao de Testes Robot - ServeRest

on:
  push:
    branches: [ "main", "master", "challenge04-genai" ]
  workflow_dispatch:

jobs:
  testes-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: Documentos/Fase 2/Sprint 4/Challenge 04 - GenAI e Engenharia de Prompt/automacao_api_serverest

    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar os testes no Robot Framework
        run: robot -d results tests/

      - name: Salvar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-robot
          path: Documentos/Fase 2/Sprint 4/Challenge 04 - GenAI e Engenharia de Prompt/automacao_api_serverest/results/
          retention-days: 7
